<!doctype html>

    <meta charset="UTF-8" />

    <!--
      ══════════════════════════════════════════════════════════════════════
      STATIC SEO FALLBACK
      ──────────────────────────────────────────────────────────────────────
      This app is a client-rendered SPA. Everything React injects into <head>
      only exists AFTER JavaScript runs. Googlebot renders JS and will see the
      per-route tags from src/seo/Seo.jsx — but these clients do NOT execute
      JS and would otherwise see an empty <head>:

        - LLM crawlers: GPTBot, ClaudeBot, PerplexityBot, Google-Extended,
          Bytespider, CCBot, Applebot-Extended
        - Link scrapers: Facebook, WhatsApp, LinkedIn, Slack, Discord, iMessage

      So the site-wide metadata and entity graph are hardcoded here. Seo.jsx
      then UPSERTS these same tags per route (it rewrites them in place rather
      than appending, so there are never duplicate meta tags).

      Keep in sync with src/seo/siteConfig.js.
      ══════════════════════════════════════════════════════════════════════
    -->

    <title>
      Zaplrn — 60-Second Microlearning App for Real Skills
    </title>
    <meta
      name="description"
      content="Zaplrn turns screen time into skill time. Learn from industry practitioners in 60-second video lessons called Zaps, grouped into structured Series."
    />
    <meta
      name="keywords"
      content="microlearning app, 60 second lessons, short video learning, learn new skills app, skill development app, alternative to mindless scrolling, structured learning series, creator education platform, Zaplrn"
    />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta
      name="googlebot"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />

    <!-- Language / locale -->
    <meta http-equiv="content-language" content="en" />
    <link rel="alternate" hreflang="en" href="https://zaplrn.com" />
    <link rel="alternate" hreflang="x-default" href="https://zaplrn.com" />

    <!-- Favicons. NOTE: previously declared type="image/svg+xml" while
         pointing at a .png, which is a MIME mismatch some browsers reject. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph -->

    <meta
      property="og:title"

    <meta property="og:image" content="https://zaplrn.com/favicon.png" />
    <meta
      property="og:image:alt"
      content="Zaplrn — Better Than Mindless Scrolling"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@zaplrn" />
    <meta name="twitter:creator" content="@zaplrn" />
    <meta
      name="twitter:title"
      content="Zaplrn — 60-Second Microlearning App for Real Skills"

    <meta name="twitter:image" content="https://zaplrn.com/favicon.png" />

            "mainEntity": [
              {
